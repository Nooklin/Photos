[versions]
# Everything below this line down to the "unverified" marker is copied verbatim
# from a real Android-Studio-generated Compose scaffold (Aug 2026). Do not
# hand-edit these without re-verifying against a fresh scaffold.
agp = "9.3.3"
coreKtx = "1.19.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.6.1"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"

# unverified: not present in the scaffold, best-known guesses only.
# If sync fails on these, add them instead via Android Studio's
# Project Structure > Dependencies search, then tell me the resolved
# versions so this file can be corrected.
navigationCompose = "2.9.0"
coil = "3.1.0"
datastore = "1.1.1"
biometric = "1.2.0-alpha05"
exifinterface = "1.3.7"
# Web-verified against Android's own Media3 release notes (developer.android.com/jetpack/androidx/releases/media3)
# at the time this was added, 1.11.0 was the current stable release, unlike
# the "unverified" guesses below this line. media3-exoplayer +
# media3-ui (PlayerView via AndroidView) rather than the newer
# media3-ui-compose-material3 artifact, the older pairing is the long-
# established, battle-tested way to add ExoPlayer to a Compose screen;
# the Compose-native player composable is comparatively new.
media3 = "1.11.0"
# Room needs a Kotlin symbol-processing (KSP) plugin for its annotation
# processor. Deliberately using the older, long-stable Room 2.x line
# (room-runtime/room-ktx/room-compiler, KSP-based) rather than the very
# recently released Room 3.0 (new androidx.room3 package, KMP-focused,
# breaking rewrite, only a few months old as of this writing), lower risk
# for a project this size. Same "verify in Android Studio" caveat as the
# rest of this unverified block applies to the Room version below.
#
# ksp = "2.3.9": confirmed via google/ksp's own GitHub releases page.
# NOT the earlier "2.2.10-2.0.2" floor version, that predates real AGP 9
# built-in-Kotlin support entirely and fails with "Using kotlin.sourceSets
# DSL to add Kotlin sources is not allowed with built-in Kotlin." Support
# was only added in KSP 2.3.1 (release notes: "Added support for AGP 9.0
# and built-in Kotlin"), and 2.3.1 itself needed a hotfix in 2.3.2 for a
# regression. 2.3.9 is the latest confirmed-published release at time of
# writing, includes further built-in-Kotlin-detection and AGP9/KSP/KAPT
# fixes on top of 2.3.1/2.3.2. See ERRORS.md for the full story.
ksp = "2.3.9"
room = "2.8.4"
# LiteRT (TensorFlow Lite's current name; org.tensorflow:tensorflow-lite is
# now a Maven "relocated artifact" pointing here), backs on-device face
# detection. Version confirmed directly from Google's
# own current "LiteRT for Android" guide (ai.google.dev/edge/litert/android),
# not guessed.
#
# Deliberately using the classic Interpreter API (org.tensorflow.lite.
# Interpreter, package name unchanged under this new Maven coordinate per
# Google's own migration guide) rather than the newer CompiledModel API.
# Google's LiteRT repo calls Interpreter "strictly deprecated for new
# features," but also documents it as "maintained for backward
# compatibility", and virtually every existing BlazeFace TFLite reference
# implementation (the actual worked examples this anchor/decode code is
# checked against) uses this classic API, not CompiledModel, which has no
# comparable reference material available yet. If Interpreter turns out not
# to work cleanly against this specific 2.1.0 package, that's the first
# thing to check, not a resolution failure like the KSP versions above, see
# ERRORS.md if that happens.
litert = "2.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# unverified
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
coil-compose = { group = "io.coil-kt.coil3", name = "coil-compose", version.ref = "coil" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-biometric = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
litert = { group = "com.google.ai.edge.litert", name = "litert", version.ref = "litert" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
