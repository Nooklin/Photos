<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Nooklin Photos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A1F1D"/>
      <stop offset="1" stop-color="#3B2A25"/>
    </linearGradient>
    <clipPath id="icon"><rect x="0" y="0" width="160" height="160" rx="36"/></clipPath>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <g transform="translate(120 70)" clip-path="url(#icon)">
    <image width="160" height="160" xlink:href="data:image/png;base64,"/>
  </g>
  <text x="330" y="150" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="86" font-weight="700" fill="#FFF4DC">Photos</text>
  <text x="332" y="198" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#F2B84B">Nooklin · private, offline, open source</text>
  <text x="332" y="240" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#FFF4DC" fill-opacity="0.65">No Play Services · no telemetry · no ads · no internet permission</text>
</svg>
